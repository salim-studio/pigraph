<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="pigraph logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111A33"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#6366F1"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)" stroke="#263156" stroke-width="2"/>
  <!-- edges -->
  <g stroke="url(#edge)" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="256" x2="140" y2="160"/>
    <line x1="256" y1="256" x2="372" y2="160"/>
    <line x1="256" y1="256" x2="140" y2="356"/>
    <line x1="256" y1="256" x2="372" y2="356"/>
    <line x1="140" y1="160" x2="372" y2="160" opacity="0.45"/>
    <line x1="140" y1="356" x2="372" y2="356" opacity="0.45"/>
  </g>
  <!-- outer nodes -->
  <g fill="url(#node)" stroke="#FFFFFF" stroke-width="8">
    <circle cx="140" cy="160" r="44"/>
    <circle cx="372" cy="160" r="44"/>
    <circle cx="140" cy="356" r="44"/>
    <circle cx="372" cy="356" r="44"/>
  </g>
  <!-- core node -->
  <circle cx="256" cy="256" r="72" fill="url(#core)" stroke="#FFFFFF" stroke-width="10"/>
  <text x="256" y="282" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="bold" fill="#FFFFFF">π</text>
</svg>
